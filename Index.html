<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cape Town Countdown</title>
  <meta name="description" content="Countdown to Cape Town — 14 March 2026 09:30 (Amsterdam)" />
  <style>
    :root{
      --bg:#070914;
      --glass: rgba(255,255,255,.10);
      --glass2: rgba(0,0,0,.22);
      --text:#f4f6ff;
      --muted: rgba(244,246,255,.78);
      --border: rgba(255,255,255,.14);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius: 22px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    /* Background slideshow */
    .bg{
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(1.08) contrast(1.05);
      transform: scale(1.03);
      transition: opacity 900ms ease;
      opacity: 1;
    }
    .bg::after{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(1200px 700px at 15% 15%, rgba(90,160,255,.35), transparent 60%),
        radial-gradient(900px 650px at 85% 75%, rgba(255,125,80,.26), transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,.50) 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.70) 100%);
    }

    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding: 26px 16px;
      position: relative;
      z-index: 1;
    }
    .card{
      width: min(980px, 94vw);
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      padding: 22px;
    }
    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    h1{
      margin:0;
      font-size: clamp(26px, 3.6vw, 42px);
      font-weight: 900;
      letter-spacing:.2px;
    }
    .sub{
      margin:8px 0 0;
      color: var(--muted);
      line-height:1.35;
      font-size: 14px;
    }
    .pillrow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
    .pill{
      display:inline-flex; gap:8px; align-items:center;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size: 13px;
      user-select:none;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .tile{
      background: var(--glass2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 14px;
      text-align:center;
    }
    .num{
      font-size: clamp(34px, 6vw, 56px);
      font-weight: 950;
      line-height:1;
    }
    .lbl{
      margin-top: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .9px;
      color: var(--muted);
      font-weight: 700;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:center;
      margin-top: 16px;
    }
    .btns{ display:flex; gap:10px; flex-wrap:wrap; }
    button{
      appearance:none;
      border:1px solid var(--border);
      background: rgba(255,255,255,.10);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 800;
    }
    button:hover{ background: rgba(255,255,255,.16); }

    .hype{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      color: var(--muted);
      font-size: 13px;
    }
    .bar{
      width: min(320px, 80vw);
      height: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.20);
      overflow:hidden;
    }
    .bar > i{
      display:block;
      height:100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(90,160,255,.95), rgba(255,125,80,.95));
      border-radius: 999px;
      transition: width 500ms ease;
    }

    footer{
      margin-top: 16px;
      color: rgba(244,246,255,.62);
      font-size: 12px;
      line-height: 1.35;
    }
    footer a{ color: rgba(244,246,255,.82); }
    .tiny{ opacity:.9; }

    /* confetti */
    canvas#confetti{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 760px){
      .grid{ grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>
  <canvas id="confetti"></canvas>

  <div class="wrap">
    <div class="card">
      <header>
        <div>
          <h1>Countdown to Cape Town ✈️</h1>
          <p class="sub">
            Departure: <strong>14 March 2026 – 09:30 (Amsterdam)</strong><br/>
            <span id="bgCaption" class="tiny">Loading photo…</span>
          </p>

          <div class="pillrow">
            <span class="pill" id="targetInfo">Target: —</span>
            <span class="pill" id="statusPill">Status: —</span>
          </div>
        </div>
      </header>

      <div class="grid" aria-label="Countdown timer">
        <div class="tile"><div class="num" id="d">—</div><div class="lbl">Days</div></div>
        <div class="tile"><div class="num" id="h">—</div><div class="lbl">Hours</div></div>
        <div class="tile"><div class="num" id="m">—</div><div class="lbl">Minutes</div></div>
        <div class="tile"><div class="num" id="s">—</div><div class="lbl">Seconds</div></div>
      </div>

      <div class="controls">
        <div class="hype">
          <strong>Hype meter</strong>
          <div class="bar" aria-label="Hype meter"><i id="hypeFill"></i></div>
          <span id="hypeText">—</span>
        </div>

        <div class="btns">
          <button id="shareBtn" type="button">Share</button>
          <button id="copyBtn" type="button">Copy link</button>
          <button id="nextPhotoBtn" type="button">Next photo</button>
        </div>
      </div>

      <footer>
        Photos from Wikimedia Commons (license/author details on each file page):
        <span id="credits"></span>
      </footer>
    </div>
  </div>

  <script>
    // ✅ Fixed: 14 March 2026, 09:30 Amsterdam time
    const DEPARTURE_ISO = "2026-03-14T09:30:00+01:00";
    const target = new Date(DEPARTURE_ISO);

    // Background photos (direct image URLs + credit links)
    const PHOTOS = [
      {
        url: "https://upload.wikimedia.org/wikipedia/commons/9/95/P1000280_Table_Mountain_from_slopes_of_Lion%27s_Head.jpg",
        label: "Table Mountain",
        creditUrl: "https://commons.wikimedia.org/wiki/File:P1000280_Table_Mountain_from_slopes_of_Lion%27s_Head.jpg"
      },
      {
        url: "https://upload.wikimedia.org/wikipedia/commons/7/72/Bo-Kaap_houses_in_Cape_Town.jpg",
        label: "Bo-Kaap",
        creditUrl: "https://commons.wikimedia.org/wiki/File:Bo-Kaap_houses_in_Cape_Town.jpg"
      },
      {
        url: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Penguins_on_boulders_beach.jpg",
        label: "Boulders Beach penguins",
        creditUrl: "https://commons.wikimedia.org/wiki/File:Penguins_on_boulders_beach.jpg"
      },
      {
        url: "https://upload.wikimedia.org/wikipedia/commons/9/95/Lighthouse_Cape_Point%2C_South_Africa.JPG",
        label: "Cape Point lighthouse",
        creditUrl: "https://commons.wikimedia.org/wiki/File:Lighthouse_Cape_Point,_South_Africa.JPG"
      }
    ];

    // Elements
    const $bg = document.getElementById("bg");
    const $bgCaption = document.getElementById("bgCaption");
    const $credits = document.getElementById("credits");

    const $d = document.getElementById("d");
    const $h = document.getElementById("h");
    const $m = document.getElementById("m");
    const $s = document.getElementById("s");

    const $targetInfo = document.getElementById("targetInfo");
    const $statusPill = document.getElementById("statusPill");

    const $hypeFill = document.getElementById("hypeFill");
    const $hypeText = document.getElementById("hypeText");

    const $copyBtn = document.getElementById("copyBtn");
    const $shareBtn = document.getElementById("shareBtn");
    const $nextPhotoBtn = document.getElementById("nextPhotoBtn");

    // Show target in local time + ISO used
    const fmt = new Intl.DateTimeFormat(undefined, {
      weekday: "short", year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
    $targetInfo.textContent = `Target: ${fmt.format(target)} (from ${DEPARTURE_ISO})`;

    // Credits (small list)
    $credits.innerHTML = PHOTOS.map(p => ` <a href="${p.creditUrl}" target="_blank" rel="noopener">${p.label}</a>`).join(" · ");

    // Background slideshow
    let photoIndex = 0;
    function setBackground(idx){
      photoIndex = (idx + PHOTOS.length) % PHOTOS.length;
      const p = PHOTOS[photoIndex];

      // cross-fade by toggling opacity briefly
      $bg.style.opacity = "0";
      setTimeout(() => {
        $bg.style.backgroundImage = `url('${p.url}')`;
        $bg.style.opacity = "1";
        $bgCaption.textContent = `Photo: ${p.label}`;
      }, 220);
    }
    setBackground(0);
    setInterval(() => setBackground(photoIndex + 1), 12000);
    $nextPhotoBtn.addEventListener("click", () => setBackground(photoIndex + 1));

    // Countdown
    function pad2(n){ return String(n).padStart(2,"0"); }

    function tick(){
      const now = new Date();
      let diff = target - now;

      if (diff <= 0){
        $d.textContent = "0"; $h.textContent = "00"; $m.textContent = "00"; $s.textContent = "00";
        document.title = "We’re off to Cape Town! ✈️";
        $statusPill.textContent = "Status: Wheels up 🛫";
        setHype(100, "MAXIMUM HYPE");
        startConfetti(true);
        return;
      }

      const totalSeconds = Math.floor(diff/1000);
      const days = Math.floor(totalSeconds/86400);
      const hours = Math.floor((totalSeconds%86400)/3600);
      const mins = Math.floor((totalSeconds%3600)/60);
      const secs = totalSeconds%60;

      $d.textContent = days;
      $h.textContent = pad2(hours);
      $m.textContent = pad2(mins);
      $s.textContent = pad2(secs);

      document.title = `${days}d ${pad2(hours)}:${pad2(mins)}:${pad2(secs)} → Cape Town`;

      // Status + Hype
      if (days >= 60) $statusPill.textContent = "Status: Planning mode 🗺️";
      else if (days >= 14) $statusPill.textContent = "Status: Getting real 😎";
      else if (days >= 7)  $statusPill.textContent = "Status: Suitcase soon 🧳";
      else if (days >= 1)  $statusPill.textContent = "Status: Any minute now 🚀";
      else                 $statusPill.textContent = "Status: TODAY. OMG. ✨";

      // Hype meter: ramp up as you approach (0..100)
      // (cap at 90+ in the final week so it feels dramatic)
      const daysToGo = diff / (1000*60*60*24);
      let hype = 100 - Math.min(100, Math.max(0, (daysToGo / 120) * 100)); // 120 days window
      if (days <= 7) hype = Math.max(hype, 90 + (7 - days) * 1.2);
      hype = Math.min(100, Math.max(0, hype));

      const hypeLabel =
        (hype < 25) ? "calm 🧘" :
        (hype < 50) ? "excited 🙂" :
        (hype < 75) ? "very excited 😁" :
        (hype < 90) ? "WOOO 🎉" :
        "ABSOLUTE SCENES 🤯";

      setHype(hype, hypeLabel);

      // Confetti in the final 7 days
      startConfetti(days <= 7);
    }

    function setHype(pct, label){
      $hypeFill.style.width = `${pct.toFixed(0)}%`;
      $hypeText.textContent = `${pct.toFixed(0)}% — ${label}`;
    }

    tick();
    setInterval(tick, 1000);

    // Share + Copy link
    $copyBtn.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(location.href);
        const old = $copyBtn.textContent;
        $copyBtn.textContent = "Copied!";
        setTimeout(()=> $copyBtn.textContent = old, 1200);
      }catch{
        alert("Couldn’t copy automatically — please copy the URL from the address bar.");
      }
    });

    $shareBtn.addEventListener("click", async () => {
      const text = "Cape Town countdown ✈️";
      const url = location.href;
      try{
        if (navigator.share){
          await navigator.share({ title: document.title, text, url });
        }else{
          await navigator.clipboard.writeText(url);
          alert("Share not supported on this browser — link copied instead.");
        }
      }catch{ /* user cancelled or blocked */ }
    });

    // Lightweight confetti (no libraries)
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let confettiOn = false;
    let confettiAlways = false;
    let pieces = [];

    function resize(){
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }
    addEventListener("resize", resize);
    resize();

    function startConfetti(on, always=false){
      confettiAlways = always;
      if (on && !confettiOn){
        confettiOn = true;
        pieces = Array.from({length: 120}, () => ({
          x: Math.random()*innerWidth,
          y: -20 - Math.random()*innerHeight,
          r: 3 + Math.random()*5,
          vy: 1.8 + Math.random()*3.2,
          vx: -1 + Math.random()*2,
          rot: Math.random()*Math.PI,
          vr: -0.08 + Math.random()*0.16
        }));
        requestAnimationFrame(drawConfetti);
      } else if (!on && !confettiAlways){
        confettiOn = false;
        ctx.clearRect(0,0,innerWidth,innerHeight);
      }
    }

    function drawConfetti(){
      if (!confettiOn && !confettiAlways) return;
      ctx.clearRect(0,0,innerWidth,innerHeight);

      for (const p of pieces){
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;

        // wrap
        if (p.y > innerHeight + 30){
          p.y = -20;
          p.x = Math.random()*innerWidth;
        }
        if (p.x < -30) p.x = innerWidth + 30;
        if (p.x > innerWidth + 30) p.x = -30;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);

        // pick a bright palette (derived from the background vibe)
        const palette = ["rgba(90,160,255,.95)","rgba(255,125,80,.95)","rgba(255,255,255,.90)","rgba(120,255,200,.80)"];
        ctx.fillStyle = palette[(Math.random()*palette.length)|0];

        ctx.fillRect(-p.r, -p.r/2, p.r*2.2, p.r);
        ctx.restore();
      }

      requestAnimationFrame(drawConfetti);
    }
  </script>
</body>
</html>
